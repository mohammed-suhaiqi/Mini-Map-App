<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wohnungs-Bot – Gegend</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --accent:#2481cc; --pick:#2e9d4f; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17212b; --fg:#f5f5f5; --line:#2b3a48; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:15px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  .tabs { display:flex; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; padding:10px 12px; border:2px solid var(--accent); border-radius:8px;
                 background:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; }
  #map { flex:1; touch-action:none; }
  #map.drawing { cursor:crosshair; }
  .bar { padding:10px 16px; border-top:1px solid var(--line); display:flex;
         gap:10px; align-items:center; }
  #what { flex:1; font-size:14px; font-weight:600; padding:10px 14px; border-radius:8px;
          background:rgba(36,129,204,.12); border:1px solid var(--accent); color:var(--fg); }
  #apply, #redraw { padding:10px 18px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font:inherit; font-weight:600; }
  #redraw { background:none; color:var(--accent); border:2px solid var(--accent); display:none; }
  #apply:disabled { opacity:.4; }
  .handle { width:18px; height:18px; border-radius:50%; background:#fff;
            border:3px solid var(--accent); box-sizing:border-box; }
</style>
</head>
<body>
<div class="tabs">
  <button id="t-bez" class="on"></button>
  <button id="t-kreis"></button>
  <button id="t-shape"></button>
</div>
<div id="map"></div>
<div class="bar">
  <div id="what"></div>
  <button id="redraw"></button>
  <button id="apply" disabled></button>
</div>
<script>
const LANG = new URLSearchParams(location.search).get("lang") === "de" ? "de" : "ar";
const T = {
  ar: { bez: "أحياء", kreis: "دائرة", shape: "ارسم منطقة", apply: "اعتماد", redraw: "✏️ من جديد",
        none: "اضغط على الأحياء التي تريدها",
        circle: (km) => `دائرة نصف قطرها ${km} كم — اسحب المركز أو الحافة`,
        draw: "ارسم بإصبعك حول المنطقة التي تريدها، بأي شكل",
        drawn: "هذه منطقتك. اضغط «اعتماد»، أو «من جديد» لترسمها مرة أخرى" },
  de: { bez: "Bezirke", kreis: "Kreis", shape: "Gebiet zeichnen", apply: "Übernehmen", redraw: "✏️ Neu",
        none: "Tippen Sie die gewünschten Bezirke an",
        circle: (km) => `Kreis mit ${km} km — Mitte oder Rand ziehen`,
        draw: "Zeichnen Sie mit dem Finger um Ihr Wunschgebiet, in beliebiger Form",
        drawn: "Das ist Ihr Gebiet. Tippen Sie «Übernehmen», oder «Neu» zum Neuzeichnen" },
}[LANG];
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
document.getElementById("t-bez").textContent = T.bez;
document.getElementById("t-kreis").textContent = T.kreis;
document.getElementById("t-shape").textContent = T.shape;
document.getElementById("apply").textContent = T.apply;
document.getElementById("redraw").textContent = T.redraw;

// Inside Telegram? Not by initData: a Mini App opened from a reply-keyboard
// button -- the bot's map button, the only kind that may sendData -- gets an
// EMPTY initData, so «اعتماد» took the browser path and sent nothing (2 Nov
// 2026). Telegram names its platform in the launch URL; a browser is "unknown".
const W = window.Telegram && Telegram.WebApp;
const tg = W && (W.initData || (W.platform && W.platform !== "unknown")) ? W : null;
if (tg) { tg.ready(); tg.expand(); }

const map = L.map("map", { zoomControl: false }).setView([52.515, 13.40], 10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "© OpenStreetMap",
}).addTo(map);

let mode = "bez";
const picked = new Set();
const layers = {};
const style = (name) => picked.has(name)
  ? { color: "#2e9d4f", weight: 2, fillColor: "#2e9d4f", fillOpacity: 0.45 }
  : { color: "#2481cc", weight: 1.5, fillOpacity: 0.08 };

fetch("berlin-bezirke.geojson").then(r => r.json()).then(geo => {
  L.geoJSON(geo, {
    style: f => style(f.properties.name),
    onEachFeature: (f, layer) => {
      const name = f.properties.name;
      layers[name] = layer;
      layer.bindTooltip(name, { sticky: true });
      layer.on("click", () => {
        if (mode !== "bez") return;
        picked.has(name) ? picked.delete(name) : picked.add(name);
        layer.setStyle(style(name));
        refresh();
      });
    },
  }).addTo(map);
});

// The circle: a centre to drag and a handle on its edge to size it.
let km = 3;
const center = L.latLng(52.515, 13.40);
const circle = L.circle(center, { radius: km * 1000, color: "#2e9d4f", weight: 2, fillOpacity: 0.15 });
const icon = L.divIcon({ className: "", html: '<div class="handle"></div>', iconSize: [18, 18] });
const mid = L.marker(center, { draggable: true, icon });
const edge = L.marker(center, { draggable: true, icon });
const edgeAt = () => L.latLng(circle.getLatLng().lat,
  circle.getLatLng().lng + km / (111.32 * Math.cos(circle.getLatLng().lat * Math.PI / 180)));
mid.on("drag", e => { circle.setLatLng(e.latlng); edge.setLatLng(edgeAt()); refresh(); });
edge.on("drag", e => {
  km = Math.max(0.5, Math.min(40, Math.round(circle.getLatLng().distanceTo(e.latlng) / 100) / 10));
  circle.setRadius(km * 1000); refresh();
});
edge.on("dragend", () => edge.setLatLng(edgeAt()));
edge.setLatLng(edgeAt());

// The drawn shape: one finger (or mouse) stroke around the area. While
// drawing, the map does not pan; once the stroke ends it can be moved and
// zoomed again, and «من جديد» draws it over.
const box = document.getElementById("map");
const shape = L.polygon([], { color: "#2e9d4f", weight: 2, fillColor: "#2e9d4f", fillOpacity: 0.3 });
let drawing = false, stroke = null, lastPx = null;

function startDrawing() {
  drawing = true; stroke = null; lastPx = null;
  shape.setLatLngs([]);
  map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
  box.classList.add("drawing");
  refresh();
}
function stopDrawing() {
  drawing = false;
  map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable();
  box.classList.remove("drawing");
}
function pointAt(e) {
  const r = box.getBoundingClientRect();
  return L.point(e.clientX - r.left, e.clientY - r.top);
}
box.addEventListener("pointerdown", e => {
  if (mode !== "shape" || !drawing) return;
  e.preventDefault();
  box.setPointerCapture(e.pointerId);
  stroke = []; lastPx = null;
  addPoint(pointAt(e));
});
box.addEventListener("pointermove", e => {
  if (!stroke) return;
  e.preventDefault();
  addPoint(pointAt(e));
});
function endStroke() {
  if (!stroke) return;
  const points = stroke; stroke = null;
  if (points.length < 3) { shape.setLatLngs([]); refresh(); return; }
  // At most 120 corners: Telegram caps what a Mini App may send at 4096 bytes.
  const step = Math.ceil(points.length / 120);
  shape.setLatLngs(points.filter((_, i) => i % step === 0));
  stopDrawing();
  refresh();
}
box.addEventListener("pointerup", endStroke);
box.addEventListener("pointercancel", endStroke);
function addPoint(px) {
  if (lastPx && lastPx.distanceTo(px) < 6) return;
  lastPx = px;
  stroke.push(map.containerPointToLatLng(px));
  shape.setLatLngs(stroke);
}
document.getElementById("redraw").onclick = startDrawing;

function setMode(m) {
  mode = m;
  document.getElementById("t-bez").classList.toggle("on", m === "bez");
  document.getElementById("t-kreis").classList.toggle("on", m === "kreis");
  document.getElementById("t-shape").classList.toggle("on", m === "shape");
  [circle, mid, edge].forEach(l => m === "kreis" ? l.addTo(map) : l.remove());
  m === "shape" ? shape.addTo(map) : shape.remove();
  if (m === "shape" && !shape.getLatLngs()[0]?.length) startDrawing();
  if (m !== "shape" && drawing) stopDrawing();
  refresh();
}
document.getElementById("t-bez").onclick = () => setMode("bez");
document.getElementById("t-kreis").onclick = () => setMode("kreis");
document.getElementById("t-shape").onclick = () => setMode("shape");

function answer() {
  if (mode === "kreis") {
    const c = circle.getLatLng();
    return { lat: +c.lat.toFixed(5), lon: +c.lng.toFixed(5), km };
  }
  if (mode === "shape") {
    const ring = shape.getLatLngs()[0] || [];
    return !drawing && ring.length >= 3
      ? { shape: ring.map(p => [+p.lat.toFixed(5), +p.lng.toFixed(5)]) } : null;
  }
  return picked.size ? { bezirke: [...picked] } : null;
}

function refresh() {
  const a = answer();
  document.getElementById("what").textContent =
    mode === "kreis" ? T.circle(km)
    : mode === "shape" ? (a ? T.drawn : T.draw)
    : (picked.size ? [...picked].join("، ") : T.none);
  document.getElementById("redraw").style.display = mode === "shape" && a ? "inline-block" : "none";
  document.getElementById("apply").disabled = !a;
}

document.getElementById("apply").onclick = () => {
  const a = answer();
  if (!a) return;
  const json = JSON.stringify(a);
  if (tg) { tg.sendData(json); return; }          // closes the Mini App itself
  if (window.opener) { window.opener.postMessage({ area: json }, "*"); window.close(); return; }
  document.getElementById("what").textContent = json;
};
refresh();
</script>
</body>
</html>
